[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rco-radar-workers"
version = "0.1.0"
description = "Workers do RCO Radar: mineração, enriquecimento, pontuação e envio."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.5,<3",
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "respx>=0.21,<1"]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
